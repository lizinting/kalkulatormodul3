<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Kalkulator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eeeeee;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }

      .kalkulator {
        background: #333;
        padding: 15px;
        border-radius: 10px;
        width: 260px;
      }

      #layar {
        width: 100%;
        height: 50px;
        font-size: 24px;
        text-align: right;
        margin-bottom: 10px;
        box-sizing: border-box;
      }

      .tombol {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      button {
        padding: 15px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .operator {
        background: orange;
      }

      .hapus {
        background: tomato;
      }
    </style>
  </head>

  <body>
    <div class="kalkulator">
      <input type="text" id="layar" disabled />

      <div class="tombol">
        <button onclick="tambah('7')">7</button>
        <button onclick="tambah('8')">8</button>
        <button onclick="tambah('9')">9</button>
        <button class="operator" onclick="tambah('/')">/</button>

        <button onclick="tambah('4')">4</button>
        <button onclick="tambah('5')">5</button>
        <button onclick="tambah('6')">6</button>
        <button class="operator" onclick="tambah('*')">*</button>

        <button onclick="tambah('1')">1</button>
        <button onclick="tambah('2')">2</button>
        <button onclick="tambah('3')">3</button>
        <button class="operator" onclick="tambah('-')">-</button>

        <button onclick="tambah('0')">0</button>
        <button onclick="tambah('.')">.</button>
        <button onclick="hitung()">=</button>
        <button class="operator" onclick="tambah('+')">+</button>

        <button class="hapus" style="grid-column: span 4" onclick="hapus()">C</button>
      </div>
    </div>

    <script>
      var layar = document.getElementById("layar");

      function tambah(nilai) {
        layar.value = layar.value + nilai;
      }

      function hapus() {
        layar.value = "";
      }
      
      function hitung() {
        try {
          layar.value = eval(layar.value);
        } catch (error) {
          layar.value = "Error";
        }
      }
    </script>
  </body>
</html>
